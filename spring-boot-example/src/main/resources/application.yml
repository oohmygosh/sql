spring:
  application:
    name: unified-query-example
  main:
    banner-mode: "off"

logging:
  file:
    name: log/unified-query-example.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
      total-size-cap: 100MB
  level:
    root: INFO

unified-query:
  default-data-source: logs
  search:
    max-page-size: 1000
    max-offset: 100000
    max-buckets: 2000
    default-time-zone: Asia/Shanghai
    time-fields:
      logs: timestamp
      analytics: timestamp
    id-fields:
      logs: id
      analytics: id
  ui:
    default-tables:
      logs: ${ES_TEST_INDEX:logevent-*}
      analytics: ${CLICKHOUSE_TEST_TABLE:log_event}
  data-sources:
    logs:
      type: elasticsearch
      url: ${ES_URL:http://192.168.100.212:9200}
      username: ${ES_USER:elastic}
      password: ${ES_PASSWORD:Elastic_Q347z5}
    analytics:
      type: clickhouse
      url: ${CLICKHOUSE_JDBC_URL:jdbc:clickhouse://192.168.100.212:18123/default}
      username: ${CLICKHOUSE_USER:admin}
      password: ${CLICKHOUSE_PASSWORD:CKPass1$}
      database: ${CLICKHOUSE_DATABASE:default}
