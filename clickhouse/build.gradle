plugins {
    id 'java-library'
    id 'io.freefair.lombok'
}
dependencies {
    api project(':core')
    testImplementation project(':api')
    testImplementation testFixtures(project(':api'))
    testImplementation 'org.junit.jupiter:junit-jupiter:5.9.3'
    testImplementation "org.mockito:mockito-core:${mockito_version}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
test { useJUnitPlatform() }
dependencies {
    compileOnly 'org.immutables:value-annotations:2.8.8'
    implementation 'com.clickhouse:clickhouse-jdbc:0.9.4:all'
}

// A live database can change independently of Gradle inputs. Do not reuse cached integration results.
test {
    outputs.upToDateWhen { System.getenv('CLICKHOUSE_TEST_URL') == null }
    outputs.cacheIf { System.getenv('CLICKHOUSE_TEST_URL') == null }
}
